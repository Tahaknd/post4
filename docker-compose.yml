x-app: &app
  image: ${APP_IMAGE:-post4-app}
  init: true
  restart: unless-stopped
  environment: &app-env
    APP_ENV: ${APP_ENV:-production}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_URL: ${APP_URL:-http://localhost:8000}
    APP_KEY: ${APP_KEY:-}
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: posthog
    DB_USERNAME: posthog
    DB_PASSWORD: ${POSTGRES_PASSWORD:-posthog}
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    CAPTURE_PROJECT_EVENTS_PER_MINUTE: ${CAPTURE_PROJECT_EVENTS_PER_MINUTE:-60000}
    CAPTURE_AUTH_FAIL_LIMIT: ${CAPTURE_AUTH_FAIL_LIMIT:-120}
    CAPTURE_AUTH_FAIL_WINDOW_SECONDS: ${CAPTURE_AUTH_FAIL_WINDOW_SECONDS:-60}
    OCTANE_WORKERS: ${OCTANE_WORKERS:-4}
    OCTANE_MAX_REQUESTS: ${OCTANE_MAX_REQUESTS:-500}
    KAFKA_BROKERS: kafka:9092
    CLICKHOUSE_URL: http://clickhouse:8123
    CLICKHOUSE_DATABASE: posthog
    CLICKHOUSE_USER: posthog
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-posthog}
    CLICKHOUSE_RO_PASSWORD: ${CLICKHOUSE_RO_PASSWORD:-posthog_ro}
  volumes:
    - app-storage:/app/storage

services:
  app:
    <<: *app
    build: .
    command: ["sh", "docker/start-app.sh"]
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8000}:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

  worker:
    <<: *app
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 70s
    healthcheck:
      disable: true
    depends_on:
      app: { condition: service_healthy }

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true
    depends_on:
      app: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: posthog
      POSTGRES_USER: posthog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-posthog}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posthog -d posthog"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      CLUSTER_ID: IeU-rb80TW2CSiQdR3txfA
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.0
    restart: "no"
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in events person_distinct_ids events_dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$t" --partitions 3 --replication-factor 1
        done

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      CLICKHOUSE_DB: posthog
      CLICKHOUSE_USER: posthog
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-posthog}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      # Read by 20-readonly-user.xml (from_env). Explicit non-empty default: an empty value would be
      # accepted as an EMPTY PASSWORD for the read-only user.
      CLICKHOUSE_RO_PASSWORD: ${CLICKHOUSE_RO_PASSWORD:-posthog_ro}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Single-file bind mount: it follows the inode, so after editing or pulling the file run
      # `docker compose up -d --force-recreate clickhouse`. A missing file must fail loudly (not
      # become a directory); see the header of the XML file.
      - type: bind
        source: ./docker/clickhouse/users.d/10-ingest-settings.xml
        target: /etc/clickhouse-server/users.d/10-ingest-settings.xml
        read_only: true
        bind:
          create_host_path: false
      # Same mechanics for the read-only user and its ro_insights profile (20-readonly-user.xml).
      - type: bind
        source: ./docker/clickhouse/users.d/20-readonly-user.xml
        target: /etc/clickhouse-server/users.d/20-readonly-user.xml
        read_only: true
        bind:
          create_host_path: false
      # Custom settings prefix SQL_ for the row policy of the read-only user (tenant isolation); same
      # single-file mechanics, see config.d/10-custom-settings.xml. Without it the policy in
      # 20-readonly-user.xml cannot load, so mount BOTH files together.
      - type: bind
        source: ./docker/clickhouse/config.d/10-custom-settings.xml
        target: /etc/clickhouse-server/config.d/10-custom-settings.xml
        read_only: true
        bind:
          create_host_path: false
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  app-storage:
  postgres-data:
  redis-data:
  kafka-data:
  clickhouse-data:
