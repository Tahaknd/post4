x-logging: &logging
  # Container logs are kept by Docker's json-file driver with NO limit by default: a chatty service fills the
  # disk (the Docker VM already ran out once). 3 files of 10 MB per container, oldest rotated away. Applies on
  # the next recreate of a service (`docker compose up -d`); a running container keeps its old setting.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  # The default tag is shared by every checkout on this machine: give a second checkout its own APP_IMAGE (see
  # .env.example), otherwise building it retags this one's image.
  image: ${APP_IMAGE:-post4-app}
  # app has `build: .`, worker and scheduler share its image and have no build section. `never` stops all
  # three from trying to pull `post4-app` from a registry on a fresh clone (it does not exist there, and
  # the pull attempt fails the `up` for worker and scheduler): the first `docker compose up` builds the
  # image once through app and the others reuse it. Verified with `docker compose --dry-run up --no-start`.
  pull_policy: never
  init: true
  restart: unless-stopped
  logging: *logging
  environment: &app-env
    APP_NAME: ${APP_NAME:-post4}
    APP_ENV: ${APP_ENV:-production}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_URL: ${APP_URL:-http://localhost:8000}
    APP_KEY: ${APP_KEY:-}
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: posthog
    DB_USERNAME: posthog
    DB_PASSWORD: ${POSTGRES_PASSWORD:-posthog}
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    # Sessions live on their OWN Redis instance (the redis-sessions service below), over the bounded `session`
    # connection of config/database.php, so a flood of guest sessions can only ever evict sessions.
    SESSION_CONNECTION: session
    REDIS_SESSION_HOST: redis-sessions
    REDIS_SESSION_DB: 0
    REDIS_SESSION_TIMEOUT: ${REDIS_SESSION_TIMEOUT:-0.5}
    REDIS_SESSION_READ_TIMEOUT: ${REDIS_SESSION_READ_TIMEOUT:-1.0}
    # The cache connection (limiters, project lookups) is bounded the same way.
    REDIS_CACHE_TIMEOUT: ${REDIS_CACHE_TIMEOUT:-0.5}
    REDIS_CACHE_READ_TIMEOUT: ${REDIS_CACHE_READ_TIMEOUT:-1.0}
    HORIZON_MAX_PROCESSES: ${HORIZON_MAX_PROCESSES:-2}
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    CAPTURE_PROJECT_EVENTS_PER_MINUTE: ${CAPTURE_PROJECT_EVENTS_PER_MINUTE:-60000}
    CAPTURE_AUTH_FAIL_LIMIT: ${CAPTURE_AUTH_FAIL_LIMIT:-120}
    CAPTURE_AUTH_FAIL_WINDOW_SECONDS: ${CAPTURE_AUTH_FAIL_WINDOW_SECONDS:-60}
    CAPTURE_BLOCKED_DECODE_MAX_BYTES: ${CAPTURE_BLOCKED_DECODE_MAX_BYTES:-16384}
    CAPTURE_STUB_MAX_BODY_BYTES: ${CAPTURE_STUB_MAX_BODY_BYTES:-65536}
    CAPTURE_STUB_CALLS_PER_MINUTE: ${CAPTURE_STUB_CALLS_PER_MINUTE:-600}
    # Security headers of the UI pages. Explicit defaults: SECURITY_CSP_MODE is report-only | enforce | off.
    SECURITY_HEADERS_ENABLED: ${SECURITY_HEADERS_ENABLED:-true}
    SECURITY_CSP_MODE: ${SECURITY_CSP_MODE:-report-only}
    # Enrichment (browser/os/device from the User-Agent, optional GeoIP). Explicit defaults on purpose: an empty
    # value would be read as false/0. CAPTURE_STORE_IP=false is the privacy default: `$ip` is used for the GeoIP
    # lookup and then dropped (PostHog keeps it).
    CAPTURE_STORE_IP: ${CAPTURE_STORE_IP:-false}
    CAPTURE_ENRICHMENT_ENABLED: ${CAPTURE_ENRICHMENT_ENABLED:-true}
    CAPTURE_UA_CACHE_ENTRIES: ${CAPTURE_UA_CACHE_ENTRIES:-2000}
    CAPTURE_UA_CACHE_MAX_BYTES: ${CAPTURE_UA_CACHE_MAX_BYTES:-2097152}
    CAPTURE_UA_PARSES_PER_REQUEST: ${CAPTURE_UA_PARSES_PER_REQUEST:-20}
    CAPTURE_STORE_RAW_UA: ${CAPTURE_STORE_RAW_UA:-false}
    GEOIP_RETRY_SECONDS: ${GEOIP_RETRY_SECONDS:-60}
    GEOIP_DB_PATH: ${GEOIP_DB_PATH:-/app/storage/geoip/geoip.mmdb}
    LOGIN_THROTTLE_EMAIL_IP_LIMIT: ${LOGIN_THROTTLE_EMAIL_IP_LIMIT:-5}
    LOGIN_THROTTLE_IP_LIMIT: ${LOGIN_THROTTLE_IP_LIMIT:-20}
    LOGIN_THROTTLE_EMAIL_LIMIT: ${LOGIN_THROTTLE_EMAIL_LIMIT:-30}
    LOGIN_THROTTLE_WINDOW_SECONDS: ${LOGIN_THROTTLE_WINDOW_SECONDS:-900}
    OCTANE_WORKERS: ${OCTANE_WORKERS:-4}
    OCTANE_MAX_REQUESTS: ${OCTANE_MAX_REQUESTS:-500}
    KAFKA_BROKERS: kafka:9092
    CLICKHOUSE_URL: http://clickhouse:8123
    CLICKHOUSE_DATABASE: posthog
    CLICKHOUSE_USER: posthog
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-posthog}
    CLICKHOUSE_RO_PASSWORD: ${CLICKHOUSE_RO_PASSWORD:-posthog_ro}
    # OPTIONAL PASS-THROUGH of the documented tuning knobs. A key with no value is the bare-name form
    # (`- NAME` in a list): the variable is passed on only when it is set in the shell or in the compose
    # `.env` file, and stays UNSET inside the container otherwise, so the default in config/*.php applies.
    # Do not rewrite these as `${NAME:-}`: that would pass an empty string, which Laravel reads as
    # 0/false/null instead of the default. Passwords and API keys are not on this list on purpose (the ones
    # the stack uses are explicit above); APP_PREVIOUS_KEYS is the one secret, for APP_KEY rotation.
    # Do not write `NAME=` (an empty value) in .env either: it is passed as an empty string. Leave the line out
    # or commented. Verify with a throwaway container, which touches nothing that is running:
    #   docker compose run --rm --no-deps -T app env | grep -E '^(INSIGHTS|KAFKA|SESSION)'
    # (`docker compose config` lists every key of this block, set or not). Applies on the next recreate
    # (`docker compose up -d`).
    APP_LOCALE:
    APP_FALLBACK_LOCALE:
    APP_PREVIOUS_KEYS:
    CAPTURE_STATUS_KAFKA_GROUP:
    CAPTURE_STATUS_MIN_FREE_BYTES:
    CAPTURE_STATUS_MIN_FREE_PERCENT:
    CLICKHOUSE_CONNECT_TIMEOUT:
    CLICKHOUSE_TIMEOUT:
    CLICKHOUSE_RO_TIMEOUT:
    CLICKHOUSE_RO_SELECT_RETRIES:
    CLICKHOUSE_RO_SELECT_RETRY_BACKOFF_MS:
    INERTIA_ENCRYPT_HISTORY:
    INSIGHTS_CACHE_STORE:
    INSIGHTS_CACHE_TTL_SECONDS:
    INSIGHTS_EVENTS_CACHE_TTL_SECONDS:
    INSIGHTS_EVENTS_EMPTY_SEARCH_CACHE_TTL_SECONDS:
    INSIGHTS_EVENTS_LOCK_TTL_SECONDS:
    INSIGHTS_EVENTS_MAX_EXECUTION_SECONDS:
    INSIGHTS_EVENTS_PROJECT_BUDGET_MS:
    INSIGHTS_EVENTS_WAIT_MS:
    INSIGHTS_FINISHED_TTL_SECONDS:
    INSIGHTS_FLIGHTFAIL_TTL_SECONDS:
    INSIGHTS_INFLIGHT_TTL_SECONDS:
    INSIGHTS_LOCK_TTL_SECONDS:
    INSIGHTS_MAX_ACTIVE_RUNS_PER_PROJECT:
    INSIGHTS_MAX_ACTIVE_RUNS_PER_USER:
    INSIGHTS_MAX_CONCURRENT_QUERIES_PER_PROJECT:
    INSIGHTS_MAX_RESULT_BYTES:
    INSIGHTS_POLL_INTERVAL_SECONDS:
    INSIGHTS_RUN_TTL_SECONDS:
    INSIGHTS_UNAVAILABLE_RETRY_AFTER_SECONDS:
    KAFKA_BREAKER_COOLDOWN_SECONDS:
    KAFKA_EVENTS_TOPIC:
    KAFKA_FLUSH_TIMEOUT_MS:
    KAFKA_MESSAGE_TIMEOUT_MS:
    LOG_AUDIT_CHANNEL:
    LOG_DAILY_DAYS:
    LOG_STDERR_FORMATTER:
    SESSION_DOMAIN:
    SESSION_ENCRYPT:
    SESSION_EXPIRE_ON_CLOSE:
    SESSION_LIFETIME:
    SESSION_SAME_SITE:
    SESSION_SECURE_COOKIE:
  volumes:
    - app-storage:/app/storage
    # OPTIONAL GeoIP: put a GeoLite2-City or DB-IP Lite City `.mmdb` (you download it yourself: licences forbid
    # bundling it) into ./geoip/geoip.mmdb and uncomment the next line on app (and on worker/scheduler if you
    # also want them to see it; only app captures events). No restart is needed after replacing the file:
    # it is reopened within a minute. Without the file no `$geoip_*` property is written and nothing fails.
    #   - ./geoip:/app/storage/geoip:ro

services:
  app:
    <<: *app
    build: .
    command: ["sh", "docker/start-app.sh"]
    # Memory limits (hard ceilings, not reservations; the sum of the defaults below is far above what the
    # stack uses, so a 4 GB host works). Measured with `docker stats` while the full default suite and the
    # clickhouse group ran in the app container: app peaked at about 480 MiB (Octane: 4 workers, PHP
    # memory_limit 256M each, so 1500m is the worst case plus headroom for a test run), worker 316 MiB,
    # scheduler 39 MiB. An exceeded limit OOM-kills the container, `restart: unless-stopped` brings it back.
    # Limits apply on the next recreate: `docker compose up -d` (no -V needed).
    mem_limit: ${APP_MEM_LIMIT:-1500m}
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8000}:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      redis-sessions: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

  worker:
    <<: *app
    command: ["php", "artisan", "horizon"]
    mem_limit: ${WORKER_MEM_LIMIT:-768m}
    stop_grace_period: 70s
    healthcheck:
      disable: true
    depends_on:
      app: { condition: service_healthy }
      redis-sessions: { condition: service_healthy }

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    mem_limit: ${SCHEDULER_MEM_LIMIT:-256m}
    healthcheck:
      disable: true
    depends_on:
      app: { condition: service_healthy }
      redis-sessions: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    # Idle usage is about 45 MiB with the stock 128 MB shared_buffers; 512m leaves room for a few connections.
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    environment:
      POSTGRES_DB: posthog
      POSTGRES_USER: posthog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-posthog}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posthog -d posthog"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Opt-in test database (profile `test`: a plain `docker compose up` never starts it). The identity tests need
  # a real Postgres (advisory locks, jsonb, concurrent sessions), which SQLite cannot provide, and they must never
  # run against the live `postgres` service above. Everything about this one is different on purpose, so a
  # mistaken environment cannot connect the two: host `postgres-test`, database `posthog_test`, its own user and
  # password (fixed, because the service is not published on any port and is gone when it stops), data on tmpfs
  # (nothing survives a stop, nothing is written to a volume), durability switched off for speed.
  # tests/TestCase.php accepts a Postgres connection only for exactly this host (see tests/Support/TestDatabaseGuard).
  # Run the suite with scripts/test-postgres.sh, which starts the service, runs
  #   docker compose exec -T app vendor/bin/pest -c phpunit.pgsql.xml
  # and removes the service again; the equivalent by hand is
  #   docker compose --profile test up -d --wait postgres-test
  #   docker compose exec -T app vendor/bin/pest -c phpunit.pgsql.xml
  #   docker compose --profile test rm -sfv postgres-test
  postgres-test:
    profiles: ["test"]
    image: postgres:17-alpine
    restart: "no"
    logging: *logging
    mem_limit: 384m
    environment:
      POSTGRES_DB: posthog_test
      POSTGRES_USER: posthog_test
      POSTGRES_PASSWORD: posthog_test
    tmpfs:
      - /var/lib/postgresql/data:size=256m
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_connections=60"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posthog_test -d posthog_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Main Redis: database 0 = queues and Horizon, 1 = cache and limiters. Sessions are NOT here any more (see
  # redis-sessions). maxmemory is per instance, so the policy has to suit both databases:
  #   volatile-ttl evicts only keys that have an expiry, soonest-expiring first, and never touches the
  #   rest. Verified against the live keyspace: queue payloads (`queues:*` lists and the reserved/delayed
  #   zsets) and Horizon's own sets (`laravel_horizon:supervisors`, `:masters`, snapshots) carry no TTL,
  #   so a job that is queued, delayed or running is never evicted. What can go under memory pressure:
  #     - the cache and ALL limiter counters (capture failure and per-project caps, the sign-in
  #       throttle, project key lookups, insight results, `capture:status` snapshots and drop counters):
  #       a limiter whose key is evicted starts counting from zero, i.e. it briefly lets more through.
  #       The short-lived ones (limiter windows, insight results: 60 s) go FIRST, which is the right order
  #       for the limiter-versus-cache tradeoff but means a memory squeeze weakens limiters before anything else;
  #       that is acceptable because nothing a user or a bot does at the front door adds memory here any more
  #       (sessions moved out), so only capture traffic and queued jobs can fill it;
  #     - Horizon job metadata hashes (`laravel_horizon:<job id>`, recent/failed job details); the jobs
  #       themselves are not affected.
  #   If memory is full and nothing is evictable, writes fail with OOM (queue pushes then error instead
  #   of silently dropping data); the cache connection fails open and capture keeps working.
  #   allkeys-lru would be unsafe here (it could evict queue payloads); noeviction would turn a full
  #   Redis into hard errors for the limiters.
  # REDIS_MAXMEMORY=0 removes the limit; REDIS_MAXMEMORY_POLICY overrides the policy.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # maxmemory (REDIS_MAXMEMORY, default 256mb) plus fork copy-on-write and client buffers: raise this limit
    # together with REDIS_MAXMEMORY (keep it about 1.5x).
    mem_limit: ${REDIS_MEM_LIMIT:-400m}
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-volatile-ttl}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Sessions only. A separate instance so that the one thing an anonymous visitor can create in bulk (a guest
  # session for every /login page view) can only evict other sessions: allkeys-lru drops the least recently
  # used key, which under a flood is an idle user's session, never a queue payload or a limiter counter. No
  # persistence on purpose: restarting this service signs everybody out, which is acceptable and keeps it
  # tiny. Residual risk, accepted: a sustained flood of /login views can still log other users out. There is
  # no per-address cap on guest session creation (a reverse proxy rate limit belongs in front of /login).
  # REDIS_SESSIONS_MAXMEMORY (default 128mb) bounds it.
  redis-sessions:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # maxmemory 128mb (REDIS_SESSIONS_MAXMEMORY), no persistence and so no fork.
    mem_limit: ${REDIS_SESSIONS_MEM_LIMIT:-200m}
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_SESSIONS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    logging: *logging
    # JVM heap is capped at 512m by KAFKA_HEAP_OPTS below; off-heap, metaspace and the page cache of the log
    # segments come on top (about 465 MiB seen under the test suites). Keep the limit well above the heap.
    mem_limit: ${KAFKA_MEM_LIMIT:-1g}
    stop_grace_period: 30s
    environment:
      CLUSTER_ID: IeU-rb80TW2CSiQdR3txfA
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.0
    restart: "no"
    logging: *logging
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in events person_distinct_ids events_dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$t" --partitions 3 --replication-factor 1
        done

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 30s
    environment:
      CLICKHOUSE_DB: posthog
      CLICKHOUSE_USER: posthog
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-posthog}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      # Read by 20-readonly-user.xml (from_env). Explicit non-empty default: an empty value would be
      # accepted as an EMPTY PASSWORD for the read-only user.
      CLICKHOUSE_RO_PASSWORD: ${CLICKHOUSE_RO_PASSWORD:-posthog_ro}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Single-file bind mount: it follows the inode, so after editing or pulling the file run
      # `docker compose up -d --force-recreate clickhouse`. A missing file must fail loudly (not
      # become a directory); see the header of the XML file.
      - type: bind
        source: ./docker/clickhouse/users.d/10-ingest-settings.xml
        target: /etc/clickhouse-server/users.d/10-ingest-settings.xml
        read_only: true
        bind:
          create_host_path: false
      # Same mechanics for the read-only user and its ro_insights profile (20-readonly-user.xml).
      - type: bind
        source: ./docker/clickhouse/users.d/20-readonly-user.xml
        target: /etc/clickhouse-server/users.d/20-readonly-user.xml
        read_only: true
        bind:
          create_host_path: false
      # Custom settings prefix SQL_ for the row policy of the read-only user (tenant isolation); same
      # single-file mechanics, see config.d/10-custom-settings.xml. Without it the policy in
      # 20-readonly-user.xml cannot load, so mount BOTH files together.
      - type: bind
        source: ./docker/clickhouse/config.d/10-custom-settings.xml
        target: /etc/clickhouse-server/config.d/10-custom-settings.xml
        read_only: true
        bind:
          create_host_path: false
      # Small-host profile (memory ceiling, caches, system log tables off, 7-day TTL on query_log/part_log) and
      # the query profiler switch. Same single-file mechanics: `docker compose up -d --force-recreate
      # clickhouse` once on an existing install. The log tables that already exist are not dropped for you:
      # see the header of config.d/20-small-host.xml.
      - type: bind
        source: ./docker/clickhouse/config.d/20-small-host.xml
        target: /etc/clickhouse-server/config.d/20-small-host.xml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docker/clickhouse/users.d/30-no-profiler.xml
        target: /etc/clickhouse-server/users.d/30-no-profiler.xml
        read_only: true
        bind:
          create_host_path: false
    # Hard container limit. ClickHouse reads the cgroup limit and sizes itself from it (20-small-host.xml sets
    # max_server_memory_usage to 0.7 of it, so 3g gives about 2.25 GB): it refuses a query with
    # MEMORY_LIMIT_EXCEEDED before the kernel could OOM-kill the container. Raise it on a bigger host, e.g.
    # CLICKHOUSE_MEM_LIMIT=6g; 0 removes the limit (the ratio then applies to the host RAM).
    mem_limit: ${CLICKHOUSE_MEM_LIMIT:-3g}
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  app-storage:
  postgres-data:
  redis-data:
  kafka-data:
  clickhouse-data:
